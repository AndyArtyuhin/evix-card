<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>evixcard — Log in</title>
<link rel="icon" href="/assets/logo-symbol.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #fafafa; color: #171717; font-family: Geist, Inter, sans-serif; }
  .btn { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 6px; background: #171717; color: #fff; font-size: 14px; font-weight: 500; text-decoration: none; transition: background 160ms cubic-bezier(0.2,0,0,1); }
  .btn:hover { background: #383838; }
  .btn:active { transform: scale(0.98); }
</style>
</head>
<body>
<main style="min-height: 100vh; box-sizing: border-box; padding: 24px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <img src="/assets/logo-symbol.svg" alt="evixcard" style="display: block; width: 36px; height: 36px;">
    <a class="btn" href="/api/login">Log In</a>
  </div>
  <div id="err" style="display: none; font-family: 'Geist Mono', monospace; font-size: 12px; color: #4d4d4d;"></div>
</main>
<script>
  const e = new URLSearchParams(location.search).get('error');
  if (e) {
    const el = document.getElementById('err');
    el.textContent = e === 'domain' ? '✕ Only @evixcash.com accounts are allowed' : '✕ Sign-in failed, try again';
    el.style.display = 'block';
  }
</script>
</body>
</html>
