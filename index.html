    if (B.pays) { const [w, h] = Component.fit(0.887 * W, 0.887 * W / (266 / 26), 266 / 26, sm ? Math.max(0.07 * H, 14) : 0.07 * H); const k = w / 266, m = Math.min((W - w) / 2, 0.0565 * W), t = topY - h / 2; L.push({ src: 'assets/pay-apple-google.svg', x: W - m - 148.9 * k, y: t, w: 148.9 * k, h: 25.42 * k }); payEvix = { src: 'assets/pay-evixcard.svg', x: m, y: t + 5.85 * k, w: 74.37 * k, h: 13.72 * k }; }

    'Visa/Eneba': Component.card('assets/back-visa.png', [{ src: 'assets/visa-logo.svg', x: 127, y: 220, w: 346, h: 150 }], true),
    'Mastercard/Eneba': Component.card('assets/back-mastercard.png', [{ src: 'assets/mastercard-logo.svg', x: 36, y: 245, w: 528, h: 100 }], true),
    'Evix/Eneba': Component.card('assets/back-evix.png', [

    if (!f) return;
    const p = this.state.platform;
    const rd = new FileReader();
    rd.onload = () => {
      const url = rd.result;
      try { localStorage.setItem(Component.LS + '-tpl-' + p, url); } catch (err) {}
      this.loadImg(url).then(im => { this.imgs[p] = im; this.setState({ tpls: { ...this.state.tpls, [p]: f.name } }, () => this.renderAll()); });
    };
    rd.readAsDataURL(f);
    e.target.value = '';
  }

  componentDidMount() {
    const tplLoads = [];
    const imgReady = Promise.all(Object.entries(Component.TEMPLATES).flatMap(([k, specs]) => specs.flatMap(s => [s, s.base]).map(s => this.compose(s).then(im => { this.imgs[k + '|' + this.sk(s)] = im; }))));
    Promise.all(tplLoads).catch(() => {});
    const files = { 400: 'Regular', 500: 'Medium', 700: 'Bold' };
    const fonts = Object.entries(files).map(([w, n]) =>
      new FontFace('RooftopCard', `url(assets/Rooftop-${n}.otf)`, { weight: w }).load().then(f => document.fonts.add(f)).catch(() => {}));
    Promise.all([imgReady, ...fonts]).then(() => {
      const c = document.createElement('canvas').getContext('2d');
      c.font = '700 100px RooftopCard';
      this.capRatio = c.measureText('H').actualBoundingBoxAscent / 100 || 0.7;
      this.cache = {}; this.ready = true; this.renderAll();
    });
  }
  componentDidUpdate(pp, ps) {
    if (ps.text !== this.state.text || ps.currency !== this.state.currency || JSON.stringify(pp) !== JSON.stringify(this.props)) this.renderAll();
  }
  opts() {
    return { currency: this.state.currency.trim(), weight: 700, size: 64, baseline: 835, maxW: 250 };
  }
  parse() {
    const valid = [], invalid = [], dups = [], seen = new Set();
    this.state.text.split(/[\s,;]+/).filter(Boolean).forEach(t => {
      const v = t.replace(/[$€₽]/g, '');
      if (/^\d+([.]\d{1,2})?$/.test(v) && parseFloat(v) > 0) {
        if (!seen.has(v)) { seen.add(v); valid.push(v); } else dups.push(v);
      } else invalid.push(t);
    });
    return { valid, invalid, dups };
  }
  label(v) {
    const c = this.opts().currency;
    if (!c) return v;
    return Component.PREFIX.includes(c) ? c + v : v + ' ' + c;
  }
  key(v, s) { return this.tk + '|' + this.sk(s) + '|' + v + '|' + JSON.stringify(this.opts()); }
  draw(v, s) {
    const o = this.opts(), n = s.num;
    const cv = document.createElement('canvas');
    const sc = s.scale || 1; cv.width = s.w * sc; cv.height = s.h * sc;
    const ctx = cv.getContext('2d'); ctx.scale(sc, sc);
    const bg = this.imgs[this.tk + '|' + this.sk(s)];
    if (bg) ctx.drawImage(bg, 0, 0, s.w, s.h);
    if (v == null) return cv.toDataURL('image/png');
    const text = this.label(v);
    let size = n.cap / this.capRatio;
    ctx.font = `${o.weight} ${size}px RooftopCard`;
    const w = ctx.measureText(text).width;
    if (w > n.maxW) { size = size * n.maxW / w; ctx.font = `${o.weight} ${size}px RooftopCard`; }
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(text, s.w / 2, n.baseline);
    return cv.toDataURL('image/png');
  }
  items() { const out = this.specs.map(s => ({ v: null, s: s.base, id: 'base@' + this.sk(s.base) })); this.parse().valid.forEach(v => this.specs.forEach(s => out.push({ v, s, id: v + '@' + this.sk(s) }))); return out; }
  renderAll() {
    if (!this.ready) return;
    const urls = {};
    this.items().forEach(({ v, s, id }) => {
      const k = this.key(v, s);
      if (!this.cache[k]) this.cache[k] = this.draw(v, s);
      urls[id] = this.cache[k];
    });
    this.setState({ urls });
  }
  fileName(v, s) {
    const c = this.opts().currency || '', cur = ({ '$': 'usd', '€': 'eur', '£': 'gbp' })[c] || c.replace(/[^\w]/g, '').toLowerCase();
    const base = `evixcard-${this.state.brand.toLowerCase()}-${this.state.platform.toLowerCase()}-${this.sk(s)}`;
    if (v == null) return `${base}.png`;
    return `${base}-${v.replace('.', '_')}${cur ? '-' + cur : ''}.png`;
  }
  async downloadZip() {
    const list = this.items();
    if (!list.length || !window.JSZip) return;
    this.setState({ busy: true, doneMsg: '' });
    const zip = new JSZip();
    list.forEach(({ v, s, id }) => {
      const url = this.state.urls[id] || this.draw(v, s);
      zip.file(this.fileName(v, s), url.split(',')[1], { base64: true });
    });
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `evixcard-${this.state.brand.toLowerCase()}-${this.state.platform.toLowerCase()}-cards.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    this.setState({ busy: false, doneMsg: `Downloaded ${list.length} cards` });
  }
  renderVals() {
    const { valid, invalid } = this.parse();
    const n = valid.length;
    const plural = n % 10 === 1 && n % 100 !== 11 ? 'карточка' : [2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100) ? 'карточки' : 'карточек';
    return {
      authed: !!this.authEmail, guest: !this.authEmail, loginOpen: !!this.state.loginOpen,
      openLogin: () => this.setState({ loginOpen: true }),
      email: this.state.email || '', setEmail: e => this.setState({ email: e.target.value, emailErr: '' }),
      hasEmailErr: !!this.state.emailErr, emailErr: this.state.emailErr,
      submitLogin: e => { e.preventDefault(); const v = (this.state.email || '').trim().toLowerCase(); if (!/^[^\s@]+@evixcash\.com$/.test(v)) return this.setState({ emailErr: '✕ Only @evixcash.com emails are allowed' }); try { localStorage.setItem('evix-auth', v); } catch (x) {} this._ae = v; this.forceUpdate(); },
      text: this.state.text,
      currency: this.state.currency,
      onCurrency: e => this.setField('currency', e.target.value),
      brands: Component.BRANDS.map(b => {
        const has = !!Component.TEMPLATES[b + '/' + this.state.platform];
        const act = b === this.state.brand;
        return { name: b, active: act, inactive: !act && has, disabled: !act && !has, pick: () => this.pick(b, this.state.platform) };
      }),
      platforms: Component.PLATFORMS.map(p => {
        const has = Component.BRANDS.some(b => Component.TEMPLATES[b + '/' + p]);
        const act = p === this.state.platform;
        return { name: p, active: act, inactive: !act && has, disabled: !act && !has, pick: () => this.pickPlatform(p) };
      }),
      platformName: this.state.platform,
      tplLabel: this.state.tpls[this.state.platform] ? '✓ ' + this.state.tpls[this.state.platform] : 'по умолчанию (PayPal)',
      onTpl: e => this.onTpl(e),
      presets: ['$', '€', '£', 'USD', 'EUR', 'SZK'].map(c => ({
        label: c,
        active: this.state.currency.trim() === c,
        inactive: this.state.currency.trim() !== c,
        pick: () => this.setField('currency', c),
      })),
      onText: e => this.setField('text', e.target.value),
      noTpl: !Component.TEMPLATES[this.tk],
      noTplMsg: `No ${this.state.brand} × ${this.state.platform} template yet`,
      cards: this.items().map(({ v, s, id }) => ({ ph: s.scale ? s.h : Math.min(240, s.h), label: v == null ? 'Base' : this.label(v), url: this.state.urls[id] || '', hasUrl: !!this.state.urls[id], loading: !this.state.urls[id], file: this.fileName(v, s), ar: `${s.w} / ${s.h}`, size: [v == null ? 'Base' : '', s.name || '', `${s.w}×${s.h}`].filter(Boolean).join(' · '), brk: (v == null && this.specs.length === 1) || (this.specs.length > 1 && (s === this.specs[this.specs.length - 1] || s === this.specs[this.specs.length - 1].base)) })),
      countLabel: `${n} ${plural}`,
      hasInvalid: invalid.length > 0,
      hasDups: this.parse().dups.length > 0,
      dupLabel: `${n} unique · ${this.parse().dups.length} duplicates skipped`,
      invalidLabel: invalid.slice(0, 5).join(', ') + (invalid.length > 5 ? '…' : ''),
      isEmpty: false,
      zipDisabled: this.state.busy || !Component.TEMPLATES[this.tk],
      zipLabel: this.state.busy ? 'Building archive…' : 'Download .zip',
      downloadZip: () => this.downloadZip(),
      btnProps: { style: { width: '100%', justifyContent: 'center' } },
      doneMsg: this.state.doneMsg,
    };
  }
}
</script>
</body>
</html>
